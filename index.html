<body class="min-h-screen flex flex-col antialiased selection:bg-amber-500/20 selection:text-mercure-navy">

    <!-- =======================================================================

         ======================================================================= -->
    <header class="sticky top-0 z-30 bg-mercure-navy text-white shadow-md border-b border-white/10">

                </div>
                <div class="min-w-0">
                    <h1 class="font-extrabold tracking-wider text-xs sm:text-sm text-white truncate">MERCURE TRABZON</h1>
                    <p id="header-subtitle" class="text-[11px] text-slate-300 truncate">Trabzon Şehir &amp; Lezzet Rehberi</p>
                </div>
            </div>

            <!-- Sağ Kontroller: TR | EN | AR + QR Kod Butonu -->
            <div class="flex items-center gap-2 shrink-0">
                <div class="inline-flex items-center bg-mercure-navySoft p-1 rounded-full border border-white/10" role="group" aria-label="Language Switcher">
                    <button onclick="setLanguage('tr')" id="btn-lang-tr" class="px-2.5 py-1 rounded-full text-xs font-bold transition-all bg-amber-500 text-mercure-navy cursor-pointer">TR</button>
                    <button onclick="setLanguage('en')" id="btn-lang-en" class="px-2.5 py-1 rounded-full text-xs font-bold transition-all text-slate-300 hover:text-white cursor-pointer">EN</button>
                    <button onclick="setLanguage('ar')" id="btn-lang-ar" class="px-2.5 py-1 rounded-full text-xs font-bold transition-all text-slate-300 hover:text-white cursor-pointer">AR</button>
                </div>

                <button
                    onclick="openQrModal()"
                    aria-label="QR Code"
                    class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20 text-amber-300 border border-amber-400/30 text-xs font-bold transition-colors cursor-pointer"
                >
                    <i data-lucide="qr-code" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">QR</span>
                </button>
            </div>
        </div>

        <!-- ===================================================================
             3 ANA KATEGORİ SEKMESİ (GEZİLECEK YERLER / RESTORANLAR / ALIŞVERİŞ)
             =================================================================== -->
        <nav class="bg-white text-mercure-navy border-b border-slate-200">
            <div class="max-w-5xl mx-auto px-3 py-2">

                    <!-- JavaScript ile 3 ana sekme oluşturulur -->
                </div>
            </div>
        </nav>
    </header>

         ======================================================================= -->

        <!-- Kategori Başlığı, Yakından Uzağa Etiketi ve Kart Sayısı -->
        <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <div class="flex items-center gap-2">
                <h2 id="active-category-heading" class="text-base sm:text-lg font-extrabold text-mercure-navy">Gezilecek Yerler</h2>
                <span id="sort-order-badge" class="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 border border-amber-200">
                    <i data-lucide="arrow-up-narrow-wide" class="w-3 h-3"></i>
                    <span id="sort-order-text">Otele Yakından Uzağa</span>
                </span>
            </div>
            <span id="cards-count-badge" class="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-200/80 text-slate-700">0</span>
        </div>

            </button>
        </div>

         QR KOD PENCERESİ
         ======================================================================= -->
    <div id="qr-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">

            currentLang = lang;
            const htmlEl = document.documentElement;
            htmlEl.setAttribute('lang', lang);
            htmlEl.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            ['tr', 'en', 'ar'].forEach(code => {
                const btn = document.getElementById(`btn-lang-${code}`);
                btn.className = code === lang

            renderUI();

            document.getElementById('qr-modal-title').textContent = labels.qrTitle;
            document.getElementById('qr-modal-desc').textContent = labels.qrDesc;
            document.getElementById('qr-copy-btn-text').textContent = labels.qrCopy;

            renderCategoryTabs();
            renderCards();

        function renderCategoryTabs() {
            const container = document.getElementById('category-tabs');

                return `

                        class="flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all cursor-pointer ${
                            isActive
                                ? 'bg-mercure-navy text-white shadow-sm'
                                : 'bg-slate-100 text-slate-600 hover:bg-slate-200/80 hover:text-mercure-navy'
                        }"
                    >
                        <i data-lucide="${tab.icon}" class="w-4 h-4 shrink-0 ${isActive ? 'text-amber-400' : 'text-slate-500'}"></i>
                        <span class="truncate">${tab.label[currentLang]}</span>
                    </button>
                `;
            }).join('');

            const activeTabObj = categoryTabsConfig.find(t => t.id === activeCategory);
            document.getElementById('active-category-heading').textContent = activeTabObj.label[currentLang];
        }

                                >
                                <!-- Yakınlık Sıra Numarası -->
                                <div class="absolute top-2.5 start-2.5 w-7 h-7 rounded-full bg-mercure-navy/85 text-amber-400 text-xs font-extrabold flex items-center justify-center border border-white/15 shadow-xs">
                                    ${idx + 1}
                                </div>
                                <!-- Çoklu Fotoğraf Rozeti -->
                                <div class="absolute bottom-2.5 end-2.5 px-2.5 py-1 rounded-full bg-mercure-navy/80 backdrop-blur-xs text-white text-[11px] font-bold flex items-center gap-1 border border-white/15">
                                    <i data-lucide="images" class="w-3.5 h-3.5 text-amber-400"></i>
                                    <span>${photoCount} ${labels.photosBadge}</span>
                                </div>
                            </div>

                            <!-- 2. Başlık + 3. Tek Cümlelik Kısa Açıklama -->
                            <div class="p-4 pb-3">
                                <h3 class="text-base sm:text-lg font-extrabold text-mercure-navy leading-snug mb-1.5">
                                    ${item.title[currentLang]}
                                </h3>
                                <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">
                                    ${item.description[currentLang]}
                                </p>
                            </div>
                        </div>

                        <!-- 4. Kart Alt Satırı: Sol Altta Bölge + KM + DK | Sağ Altta Google Haritalar -->
                        <div class="px-4 py-3 border-t border-slate-100 bg-slate-50/70 flex items-center justify-between gap-2">
                            <div class="flex flex-wrap items-center gap-1 text-[11px] font-bold text-slate-700 min-w-0">
                                <span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-white border border-slate-200 text-mercure-navy truncate max-w-[110px]">
                                    <i data-lucide="navigation" class="w-3 h-3 text-amber-600 shrink-0"></i>
                                    <span class="truncate">${areaLabel}</span>
                                </span>
                                <span dir="ltr" class="inline-flex items-center px-2 py-1 rounded-lg bg-amber-50 border border-amber-200/80 text-amber-900 whitespace-nowrap">
                                    ${item.distanceLabel}
                                </span>
                                <span dir="ltr" class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-slate-200/70 text-slate-800 whitespace-nowrap">
                                    <i data-lucide="car" class="w-3 h-3 text-slate-600 shrink-0"></i>
                                    <span>~${item.driveMinutes} ${labels.minSuffix}</span>
                                </span>
                            </div>

                            <a
                                href="${item.mapsUrl}"
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="${labels.mapsButton}"
                                class="shrink-0 py-2 px-3 rounded-xl bg-mercure-navy hover:bg-amber-600 text-white text-xs font-bold inline-flex items-center gap-1.5 transition-colors shadow-2xs"
                            >
                                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-amber-400"></i>
                                <span>Maps</span>
                            </a>
                        </div>
                    </article>
                `;
            }).join('');

            lucide.createIcons();
        }

        /* =====================================================================
           DETAY FOTOĞRAF GALERİSİ (LIGHTBOX) FONKSİYONLARI
           ===================================================================== */
        function openGalleryModal(itemId) {
            const item = guideItems.find(i => i.id === itemId);
            if (!item) return;

            galleryImages = (item.detailImages && item.detailImages.length > 0)
                ? item.detailImages
                : [item.coverImage];
            galleryIndex = 0;
            galleryItemTitle = item.title[currentLang];

            document.getElementById('gallery-title').textContent = galleryItemTitle;
            updateGalleryView();
            document.getElementById('gallery-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeGalleryModal() {
            document.getElementById('gallery-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function prevGalleryPhoto() {
            if (!galleryImages.length) return;
            galleryIndex = (galleryIndex - 1 + galleryImages.length) % galleryImages.length;
            updateGalleryView();
        }

        function nextGalleryPhoto() {
            if (!galleryImages.length) return;
            galleryIndex = (galleryIndex + 1) % galleryImages.length;
            updateGalleryView();
        }

        function goToGalleryPhoto(idx) {
            galleryIndex = idx;
            updateGalleryView();
        }

        function updateGalleryView() {
            const imgEl = document.getElementById('gallery-main-img');
            imgEl.src = galleryImages[galleryIndex];
            imgEl.alt = galleryItemTitle;

            document.getElementById('gallery-counter').textContent = `${galleryIndex + 1} / ${galleryImages.length}`;

            const thumbsContainer = document.getElementById('gallery-thumbnails');
            thumbsContainer.innerHTML = galleryImages.map((src, idx) => `
                <button
                    onclick="goToGalleryPhoto(${idx})"
                    class="w-14 h-10 rounded-lg overflow-hidden border-2 transition-all shrink-0 cursor-pointer ${
                        idx === galleryIndex ? 'border-amber-400 scale-105 opacity-100' : 'border-transparent opacity-50 hover:opacity-80'
                    }"
                >
                    <img src="${src}" alt="" class="w-full h-full object-cover">
                </button>
            `).join('');

            lucide.createIcons();
        }

        function setupGallerySwipeAndKeyboard() {
            const touchArea = document.getElementById('gallery-touch-area');
            touchArea.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            touchArea.addEventListener('touchend', (e) => {
                const diffX = e.changedTouches[0].screenX - touchStartX;
                if (Math.abs(diffX) > 40) {
                    if (diffX < 0) nextGalleryPhoto();
                    else prevGalleryPhoto();
                }
            }, { passive: true });

            document.addEventListener('keydown', (e) => {
                const galleryOpen = !document.getElementById('gallery-modal').classList.contains('hidden');
                if (!galleryOpen) return;
                if (e.key === 'Escape') closeGalleryModal();
                if (e.key === 'ArrowRight') nextGalleryPhoto();
                if (e.key === 'ArrowLeft') prevGalleryPhoto();
            });
        }

        /* =====================================================================
           QR KOD MODALI FONKSİYONLARI
           ===================================================================== */
        function openQrModal() {
            const modal = document.getElementById('qr-modal');
            const currentUrl = window.location.href;
            document.getElementById('qr-url-display').textContent = currentUrl;

            const qrContainer = document.getElementById('qrcode-container');
            if (!qrGenerated) {
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, {
                    text: currentUrl,
                    width: 190,
                    height: 190,
                    colorDark: '#0F172A',
                    colorLight: '#FFFFFF',
                    correctLevel: QRCode.CorrectLevel.M
                });
                qrGenerated = true;
            }

            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeQrModal() {
            document.getElementById('qr-modal').classList.add('hidden');
        }

        function copyCurrentPageUrl() {
            const url = window.location.href;
            const textarea = document.createElement('textarea');
            textarea.value = url;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(uiLabels[currentLang].toastCopied);
            } catch (err) {
                console.error('Copy failed:', err);
            }
            document.body.removeChild(textarea);
        }

        let toastTimeout;
        function showToast(message) {
            const box = document.getElementById('toast-box');
            document.getElementById('toast-text').textContent = message;
            box.classList.remove('translate-y-6', 'opacity-0');
            box.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                box.classList.add('translate-y-6', 'opacity-0');
                box.classList.remove('translate-y-0', 'opacity-100');
            }, 2200);
        }
    </script>
</body>
</html>
